<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo PRO - ROYGARCIA</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#111;display:flex;justify-content:center;padding: 20px;}
#contenedor-principal{width:360px;}
#recibo{width:100%;background:#f5f5f5;border-radius:20px;overflow:hidden;box-shadow: 0px 4px 15px rgba(0,0,0,0.5);}

/* ENCABEZADO */
.header{background:linear-gradient(135deg,#0B3C8C,#E30613);color:#fff;padding:15px 20px;position:relative;}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.header-info{display:flex;align-items:center;gap:10px;}
.header img{width:70px;height:auto;}
.nro-recibo{text-align:right;color:#fff;font-weight:bold;font-size:15px;background:rgba(0,0,0,0.25);padding:6px 12px;border-radius:8px;letter-spacing: 0.5px;}
.header-contacto{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2);font-size:10pt;color:#fff;opacity:0.95;text-align:center;letter-spacing:0.3px;}

.titulo{background:#E30613;color:#fff;text-align:center;padding:12px;margin:15px;border-radius:10px;font-weight:bold;font-size:18px;}

/* CUERPO Y MARCA DE AGUA */
.contenido{padding:15px;position:relative;overflow:hidden;}
.marca-agua {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-25deg);
  font-size: 48px;
  font-weight: 900;
  color: rgba(227, 6, 19, 0.18);
  border: 4px dashed rgba(227, 6, 19, 0.25);
  padding: 10px 25px;
  border-radius: 15px;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 5;
  letter-spacing: 2px;
}

input,select{border:none;background:transparent;font-size:16px;width:100%;border-bottom: 1px dashed #ccc;padding:4px 0;position:relative;z-index:10;}
input:focus, select:focus{outline: none; border-bottom: 1px solid #0B3C8C;}
.fila{margin-bottom:15px;position:relative;z-index:10;}
table{width:100%;margin-top:10px;border-collapse:collapse;position:relative;z-index:10;}
td{padding:6px;border-bottom:1px solid #ddd;vertical-align: middle;}
.totales{display:flex;gap:10px;margin-top:15px;position:relative;z-index:10;}
.total{flex:1;background:#E30613;color:#fff;padding:10px;text-align:center;border-radius:10px;font-weight:bold;}
.saldo{flex:1;background:#0B3C8C;color:#fff;padding:10px;text-align:center;border-radius:10px;font-weight:bold;}

.pie-recibo{text-align:center;padding:12px;color:#666;font-size:12px;font-weight:bold;border-top:1px dashed #ccc;margin-top:15px;position:relative;z-index:10;}

/* CONTROLES EXTERNOS */
.panel-controles{padding:15px;background:#eee;border-radius: 0 0 20px 20px;margin-top:-10px;box-shadow: 0px 4px 15px rgba(0,0,0,0.5);position:relative;z-index:10;}
.select-interno{background: #fff;border: 1px solid #ccc;border-radius: 8px;padding: 8px;margin-bottom: 10px;font-weight: bold;color: #333;}
button{width:100%;padding:12px;margin-top:8px;border:none;color:#fff;border-radius:8px;font-weight:bold;cursor:pointer;transition: 0.2s;}
button:active{transform: scale(0.98);}
.add{background:#0B3C8C; display:block; margin-bottom: 10px;}
.del{background:#999;padding:4px 8px;font-size:12px;margin:0;width:auto;display:inline-block;}
.wa{background:#25D366;}
.save{background:#555;}
.reset-btn{background:transparent; color:#777; font-size:11px; padding:4px; margin-top:10px; text-decoration:underline; font-weight:normal;}
.subtotal{font-weight:bold;text-align:right;}

/* Quitar flechas inputs de número */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
  -webkit-appearance: none; 
  margin: 0; 
}
input[type=number] { -moz-appearance: textfield; }

.texto-referencia{display:none;font-size:16px;}

/* MODAL FLOTANTE */
.modal {
  display: none; 
  position: fixed; 
  z-index: 1000; 
  left: 0; top: 0; 
  width: 100%; height: 100%; 
  background-color: rgba(0,0,0,0.9);
  justify-content: center; 
  align-items: center;
  flex-direction: column;
}
.modal-contenido {
  background: #fff;
  padding: 10px;
  border-radius: 20px;
  max-width: 90%;
  max-height: 85%;
  text-align: center;
}
.modal-contenido img {
  max-width: 100%;
  height: auto;
  border-radius: 15px;
}
.modal-instruccion {
  color: #fff;
  margin-top: 15px;
  font-size: 14px;
  text-align: center;
  padding: 0 20px;
}
.btn-cerrar {
  background: #E30613;
  margin-top: 15px;
  width: auto;
  padding: 10px 25px;
}
</style>
</head>

<body>

<div id="contenedor-principal">

  <div id="recibo">
    <div class="header">
      <div class="header-top">
        <div class="header-info">
          <img src="logo.png" alt="Logo">
          <div>
            <h2 style="margin:0;">ROYGARCIA</h2>
            <p style="margin:4px 0 0 0;font-size:13px;opacity:0.85;">Sellos personalizados</p>
          </div>
        </div>
        <div class="nro-recibo">
          Nº <span id="nroReciboTexto">00001</span>
        </div>
      </div>
      <div class="header-contacto">
        Dir, calle aroma 332, celular 69240891
      </div>
    </div>

    <div class="titulo">RECIBO</div>

    <div class="contenido">
      
      <div id="marcaCancelado" class="marca-agua">Cancelado</div>

      <div class="fila">
        <b>Cliente:</b>
        <input id="cliente" placeholder="Nombre cliente">
      </div>

      <div class="fila">
        <b>Fecha:</b>
        <input id="fecha" type="date">
      </div>

      <table id="tabla">
        <thead>
          <tr>
            <td><b>Detalle</b></td>
            <td><b>Cant</b></td>
            <td><b>Precio</b></td>
            <td><b>Sub</b></td>
            <td></td>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          </tbody>
      </table>

      <button class="add" onclick="agregarFila()">+ Agregar producto</button>

      <div class="fila" style="margin-top:15px;">
        <b>Adelanto:</b>
        <input id="adelanto" type="number" placeholder="0" oninput="calcular()">
      </div>

      <div class="totales">
        <div class="total" id="total">TOTAL: Bs. 0</div>
        <div class="saldo" id="saldo">SALDO: Bs. 0</div>
      </div>
      
      <div class="pie-recibo">
        "RoyGarcia" forma parte del grupo Galan
      </div>
    </div>
  </div>

  <div class="panel-controles">
    <select id="listaClientes" class="select-interno" onchange="cargarCliente()">
      <option value="">📁 Clientes guardados</option>
    </select>
    <button class="save" onclick="guardarCliente()">Guardar Cliente</button>
    <button class="wa" onclick="generarImagenParaCompartir()">Enviar por WhatsApp</button>
    <button class="reset-btn" onclick="ajustarNumeroManual()">⚙️ Ajustar número de recibo inicial</button>
  </div>

</div>

<div id="miModal" class="modal">
  <div class="modal-contenido" id="contenedorImagenModal"></div>
  <p class="modal-instruccion">📱 <b>Mantén presionada la imagen</b> para copiarla o compartirla directo a WhatsApp.</p>
  <button class="btn-cerrar" onclick="cerrarModal()">Regresar al Recibo</button>
</div>

<script>
const totalEl = document.getElementById("total");
const saldoEl = document.getElementById("saldo");
const cuerpoTabla = document.getElementById("cuerpoTabla");
const clienteInp = document.getElementById("cliente");
const fechaInp = document.getElementById("fecha");
const listaClientes = document.getElementById("listaClientes");
const adelantoInp = document.getElementById("adelanto");
const miModal = document.getElementById("miModal");
const contenedorImagenModal = document.getElementById("contenedorImagenModal");
const nroReciboTexto = document.getElementById("nroReciboTexto");
const marcaCancelado = document.getElementById("marcaCancelado");
let baseDeDatosNube = [];
let numeroActual = parseInt(localStorage.getItem("nroReciboCorrelativo")) || 1;
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgTJloJe6ZfjsCCHE4pvWz0yCewEc40gl1delprzyHyCKHFB8TTSxPcXnhAzgLgO4d/exec";
  
window.onload = ()=>{
 fechaInp.value = new Date().toISOString().split('T')[0];
 actualizarVisorNumero();
 sincronizarConNube();
 agregarFila();
}

function actualizarVisorNumero() {
  nroReciboTexto.innerText = String(numeroActual).padStart(5, '0');
}

function bs(n){ return "Bs. " + n.toLocaleString('es-BO', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

// FILAS CORREGIDAS Y SEGUROS DE RENDERIZADO
function agregarFila(){
 let tr = document.createElement("tr");
 tr.innerHTML = `
  <td><input placeholder="Producto" class="prod-detalle"></td>
  <td>
    <input type="number" placeholder="1" oninput="calcular()" class="prod-cant" style="width:40px;">
    <span class="texto-referencia txt-cant">1</span>
  </td>
  <td>
    <input type="number" placeholder="0" oninput="calcular()" class="prod-precio" style="width:60px;">
    <span class="texto-referencia txt-precio">0</span>
  </td>
  <td class="subtotal">Bs. 0.00</td>
  <td><button class="del" onclick="this.closest('tr').remove();calcular()">X</button></td>
 `;
 cuerpoTabla.appendChild(tr);
 calcular();
}

function calcular(){
 let total = 0;
 let filas = cuerpoTabla.querySelectorAll("tr");

 filas.forEach(tr => {
  let cantRaw = tr.querySelector(".prod-cant").value;
  let cant = cantRaw === "" ? 1 : +cantRaw;
  let precio = +tr.querySelector(".prod-precio").value || 0;

  tr.querySelector(".txt-cant").innerText = cant;
  tr.querySelector(".txt-precio").innerText = precio;

  let sub = cant * precio;
  tr.querySelector(".subtotal").innerText = bs(sub);

  total += sub;
 });

 let adel = +adelantoInp.value || 0;
 let saldoCalculado = total - adel;

 totalEl.innerText = "TOTAL: " + bs(total);
 saldoEl.innerText = "SALDO: " + bs(saldoCalculado);

 if(total > 0 && saldoCalculado <= 0) {
   marcaCancelado.style.display = "block";
 } else {
   marcaCancelado.style.display = "none";
 }
}

function guardarCliente(){
 let n = clienteInp.value.trim();
 if(!n) return alert("Escribe un nombre de cliente primero.");

 let lista = JSON.parse(localStorage.getItem("clientes")||"[]");
 if(!lista.includes(n)){
  lista.push(n);
  localStorage.setItem("clientes", JSON.stringify(lista));
  cargarLista();
  alert("Cliente guardado con éxito.");
 } else {
  alert("El cliente ya estaba guardado.");
 }
}

function cargarLista(){
 let lista = JSON.parse(localStorage.getItem("clientes")||"[]");
 listaClientes.innerHTML = '<option value="">📁 Clientes guardados</option>';
 lista.forEach(c=>{
  let o = document.createElement("option");
  o.value = c;
  o.textContent = c;
  listaClientes.appendChild(o);
 });
}

function cargarCliente(){
 if(listaClientes.value) {
   clienteInp.value = listaClientes.value;
 }
}

function generarImagenParaCompartir(){
 let d = document.querySelectorAll(".del");
 let btnAdd = document.querySelector(".add");
 let inputsCant = document.querySelectorAll(".prod-cant");
 let inputsPrecio = document.querySelectorAll(".prod-precio");
 let textosCant = document.querySelectorAll(".txt-cant");
 let textosPrecio = document.querySelectorAll(".txt-precio");
 
 btnAdd.style.display = "none";
 d.forEach(x => x.style.display = "none");
 
 inputsCant.forEach(i => i.style.display = "none");
 inputsPrecio.forEach(i => i.style.display = "none");
 textosCant.forEach(t => t.style.display = "inline-block");
 textosPrecio.forEach(t => t.style.display = "inline-block");

 html2canvas(document.getElementById("recibo"), {scale: 2}).then(canvas => {
  let img = document.createElement("img");
  img.src = canvas.toDataURL("image/png");
  
  contenedorImagenModal.innerHTML = "";
  contenedorImagenModal.appendChild(img);
  miModal.style.display = "flex";

  btnAdd.style.display = "block";
  d.forEach(x => x.style.display = "inline-block");
  inputsCant.forEach(i => i.style.display = "inline-block");
  inputsPrecio.forEach(i => i.style.display = "inline-block");
  textosCant.forEach(t => t.style.display = "none");
  textosPrecio.forEach(t => t.style.display = "none");

  numeroActual++;
  localStorage.setItem("nroReciboCorrelativo", numeroActual);
  actualizarVisorNumero();
 });
}

function cerrarModal() {
  miModal.style.display = "none";
}

function ajustarNumeroManual() {
  let nuevoNumero = prompt("¿Desde qué número de recibo deseas continuar?", numeroActual);
  if (nuevoNumero !== null && !isNaN(nuevoNumero) && nuevoNumero.trim() !== "") {
    numeroActual = parseInt(nuevoNumero);
    localStorage.setItem("nroReciboCorrelativo", numeroActual);
    actualizarVisorNumero();
  }
  function sincronizarConNube() {
  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      baseDeDatosNube = data;
      actualizarSelectorClientes();
    })
    .catch(() => {
      listaClientes.innerHTML = '<option value="">📁 Error de conexión nube</option>';
    });
}

function actualizarSelectorClientes() {
  let nombresUnicos = [...new Set(baseDeDatosNube.map(item => item.cliente.trim()))].sort();
  listaClientes.innerHTML = '<option value="">📁 Clientes en Google Sheets</option>';
  nombresUnicos.forEach(nombre => {
    if(nombre) {
      let o = document.createElement("option");
      o.value = nombre; o.textContent = nombre;
      listaClientes.appendChild(o);
    }
  });
}

function guardarCliente(){
 let nombreCliente = clienteInp.value.trim();
 if(!nombreCliente) return alert("Por favor escribe el nombre de un cliente.");

 let productosLlevados = [];
 cuerpoTabla.querySelectorAll("tr").forEach(tr => {
    let det = tr.querySelector(".prod-detalle").value || "Sello";
    let cant = tr.querySelector(".prod-cant").value || 1;
    let prec = tr.querySelector(".prod-precio").value || 0;
    if(prec > 0) productosLlevados.push(`${cant}x ${det} (Bs. ${Number(prec)})`);
 });

 let datosAEnviar = {
    recibo: nroReciboTexto.innerText,
    fecha: fechaInp.value,
    cliente: nombreCliente,
    detalles: productosLlevados.join(", ") || "Ficha cliente",
    total: totalEl.innerText.replace("TOTAL: Bs. ", ""),
    obs: observacionInp.value.trim() || "Sin notas."
 };

 fetch(SCRIPT_URL, {
   method: "POST",
   mode: "no-cors",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify(datosAEnviar)
 })
 .then(() => {
   alert("¡Éxito! Guardado en Google Sheets.");
   setTimeout(sincronizarConNube, 1500); 
 });
}

function cargarCliente(){
 if(listaClientes.value) {
   clienteInp.value = listaClientes.value;
 }
}
}
</script>

</body>
</html>
